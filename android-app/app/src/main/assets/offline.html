<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - METAR Lens</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1116;
        --card: #141a22;
        --text: #f3f5f7;
        --muted: #9aa4b2;
        --accent: #7dd3fc;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1c2a3a 0%, transparent 45%), var(--bg);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 14px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 14px;
        background: var(--accent);
        color: #07253c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>You are offline</h1>
      <p>
        METAR Lens is installed and available, but live weather APIs need an internet connection.
      </p>
      <button type="button" onclick="window.location.href='https://appassets.androidplatform.net/assets/www/index.html'">
        Retry
      </button>
    </section>
  </body>
</html>
